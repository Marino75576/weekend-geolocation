[project]
name = "ip-geolocation-loader"
version = "0.1.0"
description = "Load and index IP-to-country CSV data for fast range lookup using binary search on sorted start addresses."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
